<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigurna prijava</title>
    <link rel="stylesheet" href="zadaca.css">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <link rel="stylesheet" href="htpps://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <div class="lock-icon">
        <i class="fa-solid fa-lock"></i>
    </div>

    <div class="login-card">
        <fieldset>
            <legend>Sigurna prijava</legend>
            <label>Korisničko ime</label>
            <input type="text" value="admin">
            <label>Lozinka</label>
            <input type="password" value="12345">

            <div class="remember">
                <input type="checkbox" id="remember">
                <label for="remember">Zapamti uređaj</label>

            </div>

            <button>Prijavi se</button>


        </fieldset>

    </div>

    <div class="activity-section">
        <h2>Nedavne aktivnosti prijave</h2>

        <table>
            <thead>
                <tr>
                    <th>IP ADRESA</th>
                    <th>VRIJEME</th>
                    <th>STATUS</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>192.168.1.15</td>
                    <td>12:45</td>
                    <td class="success">Uspjeh</td>
                </tr>

                <tr>
                    <td>10.0.0.52</td>
                    <td>Jučer</td>
                    <td class="error">Greška</td>
                </tr>

                <tr>
                    <td>88.102.x.x</td>
                    <td>01.12.</td>
                    <td></td>
                </tr>
            </tbody>


        </table>
        <div class="footer">Prikaz zadnja 3 pokušaja</div>

    </div>

</body>

</html>
