<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout sa slike</title>
    <link rel="stylesheet" href="zadaca.css">
</head>
<body>
    <div class="container">
        <!--P1:Zaglavlje-->
        <header class="box p1">P1</header>

        <!--Središnji dio sadrži P2, glavni sadržaj i P4-->
        <div class="middle-section">
            <!--P2: Lijevi stupac-->
            <aside class="box p2">P2</aside>

            <!--Središnji prostor sa S elementima-->
            <main class="content-area">
                <div class="box s1">S1</div>
                <div class="box s2">S2</div>
                <div class="box s3">S3</div>
            </main>

            <!--P4: Desni stupac-->
            <aside class="box p4">P4</aside>
        </div>

        <!--P5: Podnožje-->
        <footer class="box p5">P5</footer>


    </div>
    
</body>
</html>
