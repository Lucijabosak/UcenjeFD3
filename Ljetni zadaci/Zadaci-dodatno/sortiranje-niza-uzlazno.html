<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sortiranje Niza</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 380px;
            text-align: center;
        }
        h2 { color: #243b55; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        input {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            width: 100%;
        }
        input:focus { border-color: #243b55; outline: none; }
        button {
            padding: 12px;
            background: #243b55;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background: #141e30; }
        .result {
            margin-top: 15px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
            border-left: 4px solid #243b55;
            text-align: left;
            font-size: 15px;
            color: #333;
            word-wrap: break-word;
            display: none;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Sortiranje Niza</h2>
    <p>Unesite brojeve odvojene zarezom (npr. 45, 12, 8, 99, 1):</p>
    
    <div class="input-group">
        <input type="text" id="nizSortUnos" placeholder="12, 5, 89, 1, 23">
        <button onclick="sortirajNiz()">Sortiraj Uzlazno</button>
    </div>

    <div class="result" id="rezultat9"></div>
</div>

<script>
    function sortirajNiz() {
        const unos = document.getElementById('nizSortUnos').value;
        const rezDiv = document.getElementById('rezultat9');

        if (unos.trim() === "") {
            rezDiv.style.display = 'block';
            rezDiv.style.borderLeftColor = '#c0392b';
            rezDiv.style.color = '#c0392b';
            rezDiv.innerHTML = "<strong>Upozorenje:</strong> Polje ne smije biti prazno!";
            return;
        }

    
        let elementi = unos.split(',').map(el => el.trim()).filter(el => el !== "");
        
        
        let jesuBrojevi = elementi.every(el => !isNaN(el));

        if (!jesuBrojevi) {
            rezDiv.style.display = 'block';
            rezDiv.style.borderLeftColor = '#c0392b';
            rezDiv.style.color = '#c0392b';
            rezDiv.innerHTML = "<strong>Greška:</strong> Svi elementi u nizu moraju biti brojevi!";
            return;
        }

        
        let brojčaniNiz = elementi.map(Number);
        brojčaniNiz.sort(function(a, b) {
            return a - b; 
        });

        rezDiv.style.display = 'block';
        rezDiv.style.borderLeftColor = '#243b55';
        rezDiv.style.color = '#333';
        rezDiv.innerHTML = `<strong>Originalni niz:</strong> [ ${elementi.join(', ')} ]<br><strong>Sortirani niz:</strong> <span style="color:#243b55; font-weight:bold;">[ ${brojčaniNiz.join(', ')} ]</span>`;
    }
</script>

</body>
</html>
